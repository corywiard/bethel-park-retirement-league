<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bethel Park Retirement Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* VOICE: Sunday-afternoon broadcast, confident and quick to read
   IDEA: the stadium scoreboard and the league program you get at the gate
   PICTURE: scoreboard matchup cards under a turf header with chalk yard lines
   COLOUR and TYPE: turf green field, chalk white, pylon orange accent; Barlow Condensed numbers + Barlow text
   LAYOUT: turf band with nav, then the working view (matchups, standings, teams, history) */
:root{color-scheme:light dark;
--bg:light-dark(#f3f6f1,#0b130e);--card:light-dark(#ffffff,#132019);--ink:light-dark(#0d1f14,#e8f0ea);
--mute:light-dark(#5b6b60,#93a698);--line:light-dark(#dde5de,#24362a);--turf:#0f5a32;--turf2:#0c4a29;
--pylon:#ff5a1f;--win:light-dark(#0f5a32,#5fd38f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(24px,4vw,56px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
pre,.scroll{overflow-x:auto}html{scroll-padding-top:72px}
a{color:inherit}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif}
header{background:var(--turf);color:#fff;position:relative;overflow:hidden;
background-image:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(255,255,255,.16) calc(10% - 2px) 10%),
linear-gradient(180deg,var(--turf),var(--turf2))}
header .band{padding-bottom:0}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font:800 clamp(34px,6vw,52px)/1.05 "Barlow Condensed",sans-serif;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;opacity:.85}
.pill{display:inline-block;background:var(--pylon);color:#fff;font:700 15px/1 "Barlow Condensed";padding:8px 12px;border-radius:4px;white-space:nowrap}
nav{display:flex;gap:4px;margin-top:22px;overflow-x:auto}
nav a{flex:none;text-decoration:none;font:700 18px/1 "Barlow Condensed";padding:14px 16px 12px;border-radius:8px 8px 0 0;color:#fff;opacity:.85}
nav a[aria-current]{background:var(--bg);color:var(--ink);opacity:1}
nav a:focus-visible,button:focus-visible,.weeks a:focus-visible,.tcard:focus-visible{outline:3px solid var(--pylon);outline-offset:2px}
h2{font:800 clamp(30px,4vw,40px)/1.05 "Barlow Condensed";margin:0 0 4px;text-wrap:balance}
h3{font:700 22px/1.1 "Barlow Condensed";margin:28px 0 10px}
.note{color:var(--mute);font-size:14px;margin:0 0 18px}
.weekbar{display:flex;align-items:center;gap:8px;margin:14px 0 20px}
.weeks{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px;flex:1}
.weeks a{flex:none;scroll-snap-align:center;text-decoration:none;min-width:44px;height:44px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--card);font:700 17px "Barlow Condensed"}
.weeks a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.weeks a.live{border-color:var(--pylon);color:var(--pylon)}.weeks a.live.on{background:var(--pylon);color:#fff}
button{font:inherit;cursor:pointer}
.arrow{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.mu{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.mu .st{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:10px 16px 0}
.mu .st b{color:var(--pylon);font-weight:600}
.side{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;text-decoration:none}
.side+.side{border-top:1px dashed var(--line)}
.side .nm{font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .ow{font-size:13px;color:var(--mute)}
.score{font:700 34px/1 "Barlow Condensed";font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.score small{display:block;font:500 13px Barlow;color:var(--mute);margin-top:2px}
.side.lose .score{color:var(--mute)}
.side.won .score{color:var(--win)}
.side.won .nm::after{content:" ◀";color:var(--win);font-size:12px}
.bar{height:5px;background:var(--line);display:flex}.bar i{background:var(--pylon)}
.badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 16px/1 "Barlow Condensed";flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.badge.big{width:84px;height:84px;font-size:32px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font:600 13px Barlow;color:var(--mute);background:light-dark(#eef3ee,#0f1a13)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tl{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600}
.tl .badge{width:30px;height:30px;font-size:12px}
.po td:first-child{box-shadow:inset 4px 0 0 var(--win)}
.bye td:first-child{box-shadow:inset 4px 0 0 var(--pylon)}
.tag.cl{background:var(--win);color:var(--bg)}.tag.out{background:var(--mute)}
.tag{flex:none;font:700 12px/1 Barlow;color:#fff;background:var(--pylon);border-radius:4px;padding:4px 6px;margin-left:2px}
.wl{font:700 15px "Barlow Condensed";display:inline-block;width:22px;text-align:center;border-radius:4px;color:#fff;background:var(--mute)}
.wl.W{background:var(--win);color:var(--bg)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.tcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-decoration:none}
.tcard b{display:block;line-height:1.2}.tcard span{font-size:14px;color:var(--mute)}
.thead{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:700 30px/1 "Barlow Condensed";white-space:nowrap}.stat span{font-size:13px;color:var(--mute)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 24px}
.trophy{color:var(--pylon)}
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.champ{background:var(--turf);color:#fff;border-radius:12px;padding:16px;display:flex;gap:12px;align-items:center}
.champ .yr{font:800 34px/1 "Barlow Condensed";color:#ffd5c4}
.champ span{font-size:14px;opacity:.85}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--card);margin:4px 0 16px}
.seg button{min-height:40px;padding:0 16px;border:0;border-radius:7px;background:none;color:var(--ink);font:600 15px Barlow}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:3px solid var(--pylon);outline-offset:2px}
.h2h th,.h2h td{padding:6px 4px;text-align:center}.h2h th:first-child{text-align:left;white-space:nowrap;padding-left:10px}
.h2h thead th .badge{width:30px;height:30px;font-size:11px;margin:auto}
.hx button{all:unset;cursor:pointer;display:block;min-width:46px;min-height:36px;line-height:36px;font:600 15px/36px "Barlow Condensed";font-variant-numeric:tabular-nums;border-radius:6px}
.hx button:focus-visible{outline:3px solid var(--pylon)}.hx.self{color:var(--mute)}
.pairsel{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-bottom:6px}.pairsel span{padding-bottom:12px;color:var(--mute)}
label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
select{font:16px Barlow;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px;max-width:100%}
select:focus-visible{outline:3px solid var(--pylon);outline-offset:2px}
.bracket{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:center}
.rd{display:grid;gap:14px}.rd h4{margin:0;font:700 15px Barlow;color:var(--mute)}
.bx{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bx.bye1{border-style:dashed}
.bt{display:grid;grid-template-columns:22px 30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;text-decoration:none;min-height:44px}
.bt+.bt{border-top:1px solid var(--line)}
.bt .badge{width:30px;height:30px;font-size:11px}.bt .sd{font:700 15px "Barlow Condensed";color:var(--mute);text-align:center}
.bt .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.bt .bs{font:700 18px "Barlow Condensed";font-variant-numeric:tabular-nums}
.bt.w .bs,.bt.w .bn{color:var(--win)}.bt.l{opacity:.6}.bt.tbd{display:block;color:var(--mute);font-size:14px;line-height:28px}
.champbox{display:flex;gap:12px;align-items:center;background:var(--turf);color:#fff;border-radius:10px;padding:14px}
.champbox span{display:block;font-size:13px;opacity:.85}.champbox b{font:700 22px/1.1 "Barlow Condensed"}
@media(max-width:700px){.bracket{grid-template-columns:minmax(0,1fr)}}
.tro.gold{background:var(--turf);color:#fff;border-color:var(--turf)}.tro.gold span{color:#e4f3ea}
.tro.shame b{color:var(--pylon)}
.acts{display:grid;gap:6px}
.act{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:14px}
.act .badge{width:28px;height:28px;font-size:10px}
.abar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.abar i{display:block;height:100%;background:var(--pylon)}
.act .n{color:var(--mute);white-space:nowrap}
@media(max-width:600px){.act{grid-template-columns:minmax(0,1fr) auto}.abar{display:none}}
.mvbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:end}.mvbar .seg{margin:0}
.mvs{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.mv{display:grid;grid-template-columns:56px 92px minmax(0,1fr);gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mv p{margin:0 0 4px}.mv p:last-child{margin:0}.mv .tl{display:inline-flex;vertical-align:middle;margin-right:4px}.mv .badge{width:26px;height:26px;font-size:10px}
.when{color:var(--mute);font-size:14px;white-space:nowrap;padding-top:3px}
.kind{font:700 12px/1 Barlow;border-radius:4px;padding:6px 7px;text-align:center;justify-self:start;margin-top:2px}
.kind.trade{background:var(--pylon);color:#fff}.kind.waiver{background:var(--turf);color:#fff}.kind.fa{background:var(--line);color:var(--ink)}
@media(max-width:600px){.mv{grid-template-columns:auto auto;}.mv>div{grid-column:1/-1}}
.more{margin-top:14px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-weight:600}
.oddcell{min-width:110px}.oddcell b{display:inline-block;min-width:42px}
.ob{display:inline-block;vertical-align:middle;width:54px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-right:8px}.ob i{display:block;height:100%;background:var(--win)}
.lk{position:relative;display:inline-block;vertical-align:middle;width:min(110px,40vw);height:10px;background:var(--line);border-radius:5px;margin-right:8px}
.lk::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--mute)}
.lk i{position:absolute;top:0;bottom:0;border-radius:5px}.lk i.pos{background:var(--win)}.lk i.neg{background:var(--pylon)}
b.pos{color:var(--win)}b.neg{color:var(--pylon)}.luckcell{white-space:nowrap}
.seg{flex-wrap:wrap}
footer{color:var(--mute);font-size:14px;text-align:center}
.back{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;color:var(--mute);font-weight:600}
@media(max-width:600px){table{font-size:14px}th,td{padding:9px 8px}.score{font-size:30px}.hide-s{display:none}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .8s ease}main{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<header>
  <div class="band"><div class="wrap">
    <div class="top">
      <div><h1>Bethel Park Retirement Home</h1><p class="sub">10 teams · 2026 season · On ESPN since 2021</p></div>
      <span class="pill" id="wkpill"></span>
    </div>
    <nav id="nav">
      <a href="#matchups" data-v="matchups">Matchups</a>
      <a href="#standings" data-v="standings">Standings</a>
      <a href="#playoffs" data-v="playoffs">Playoffs</a>
      <a href="#teams" data-v="teams">Teams</a>
      <a href="#h2h" data-v="h2h">Head to head</a>
      <a href="#moves" data-v="moves">Trades and pickups</a>
      <a href="#history" data-v="history">League history</a>
    </nav>
  </div></div>
</header>
<main class="band"><div class="wrap" id="view"></div></main>
<footer class="band" id="asof"></footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
